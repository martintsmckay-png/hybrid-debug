<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hybrid Debug Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #beadware-canvas {
      width: 100%;
      height: 160px;
      display: block;
      margin-top: 20px;
      border-radius: 8px;
      background: radial-gradient(circle at top left, #1b1b2f, #050509);
    }
  </style>
</head>
<body>
  <h1>Hybrid Debug Dashboard</h1>

  <section id="xp-panel">
    <span id="xp-level">Level 1</span> ·
    <span id="xp-points">0 XP</span>
  </section>

  <section id="task-editor">
    <input id="new-task-input" placeholder="New task..." />
    <button id="add-task-btn">Add</button>
  </section>

  <div id="task-container"></div>

  <section id="narrative-panel">
    <h2>Kinship Diagnostics</h2>
    <p id="narrative-text">System stable. Kinship loops nominal.</p>
  </section>

  <canvas id="beadware-canvas"></canvas>

  <script src="app.js"></script>
  <script src="transcendence.js"></script>
  <script src="beadware.js"></script>
</body>
</html>
